# Swing Pullback — 하루 1회 거래 목표 D3 (공격, 15m)
# 목표: BTC/USDT 15m, 하루 3~10회 거래
mode: backtest
live_confirmed: false
symbol: "BTC/USDT"
timeframe: "15m"
starting_cash: 10000.0
fee_bps: 10.0
slippage_bps: 5.0
exchange: {id: binance, sandbox: false}
strategy:
  name: swing_pullback
  params:
    macro_ema_period: 200     # 15m × 200 = 2일 (거시 추세 필터 매우 완화)
    st_period: 10
    st_multiplier: 3.0
    rsi_period: 14
    rsi_pullback_low: 30.0    # 30 → 60 범위 30 (매우 넓음)
    rsi_pullback_high: 60.0
    rsi_overbought: 75.0      # 과매수 기준도 상향 (70 → 75)
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    require_volume: false
    vol_period: 20
    vol_mult: 1.0
risk:
  max_position_pct: 0.20      # 공격 빈도 ↑ → 포지션 축소
  stop_loss_pct: 0.04
  max_daily_loss_pct: 0.08
  trailing_stop_pct: 0.025
  trailing_activate_pct: 0.04
notifiers: [console]
