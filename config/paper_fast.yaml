# 학습/데모용 빠른 페이퍼 설정.
# - 1m 타임프레임 → 봉이 1분마다 닫힘
# - MA(5/15) 짧은 파라미터 → 16봉(~16분) warmup 후 즉시 신호 가능
# 실전 학습에는 CLAUDE.md 로드맵의 1h + ma_crossover(20/50) 를 권장.
mode: paper
live_confirmed: false

symbol: "BTC/USDT"
timeframe: "1m"
starting_cash: 10000.0
fee_bps: 10.0
slippage_bps: 5.0

exchange:
  id: binance
  sandbox: true

strategy:
  name: ma_crossover
  params:
    fast: 5
    slow: 15

risk:
  max_position_pct: 0.10
  stop_loss_pct: 0.05
  max_daily_loss_pct: 0.05

notifiers:
  - console
