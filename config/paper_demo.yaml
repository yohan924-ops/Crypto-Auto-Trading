# 데모용 — buy_and_hold 로 첫 봉 즉시 매수. 대시보드 체결 마커 확인용.
# 이 설정은 "학습" 이 아니라 "파이프라인 시각 확인" 이 목적.
mode: paper
live_confirmed: false

symbol: "BTC/USDT"
timeframe: "1m"
