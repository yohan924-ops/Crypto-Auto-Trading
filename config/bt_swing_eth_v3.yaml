# Phase B — ETH 단독 Gemini 튜닝 버전
# 주요 변경:
#   - RSI 매수: 40-45 → 30-35 (깊은 눌림 타겟, ETH 의 L자 횡보 대응)
#   - Supertrend: (10, 3) → (12, 3) (살짝 둔화)
#   - trailing stop: 5% → 6% (ETH 변동성 고려)
mode: backtest
live_confirmed: false
symbol: "ETH/USDT"
timeframe: "4h"
starting_cash: 10000.0
fee_bps: 10.0
slippage_bps: 5.0
exchange: {id: binance, sandbox: false}
strategy:
  name: swing_pullback
  params:
    macro_ema_period: 300
    st_period: 12             # 10 → 12
    st_multiplier: 3.0
    rsi_period: 14
    rsi_pullback_low: 32.0
    rsi_pullback_high: 42.0
    rsi_overbought: 70.0
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    require_volume: true
    vol_period: 20
    vol_mult: 1.0
risk:
  max_position_pct: 0.30
  stop_loss_pct: 0.08
  max_daily_loss_pct: 0.10
  trailing_stop_pct: 0.06     # 0.05 → 0.06
  trailing_activate_pct: 0.10
notifiers: [console]
